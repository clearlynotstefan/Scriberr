name: scriberr-canary-test

services:
  scriberr-canary-test:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    image: scriberr:canary-transformers-test
    container_name: scriberr-canary-test
    ports:
      - "8182:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - APP_ENV=production
      - SCRIBERR_CANARY_BACKEND=transformers
      - SCRIBERR_CANARY_TEST_ONLY=1
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
    volumes:
      # Completely separate experimental application state.
      - /mnt/user/appdata/scriberr-canary-test/data:/app/data
      - /mnt/user/appdata/scriberr-canary-test/home:/home

      # Completely separate Python/model environment. The test-only Canary
      # adapter does not install NeMo or download canary-1b-v2.nemo.
      - /mnt/user/appdata/scriberr-canary-test/models:/app/whisperx-env

      # Share only the download/cache tree. Transformers Canary safetensors are
      # downloaded once here and can be reused across rebuilds/containers.
      - /mnt/user/appdata/scriberr/cache:/root/.cache

      # Deliberately no watch-folder mount during testing.
    restart: unless-stopped
